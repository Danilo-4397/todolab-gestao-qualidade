name: Quality Gate 0

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Testes de aceitação
        run: npm test
      - name: Cobertura mínima (60%)
        run: npm run test:coverage
      - name: Guard-tests
        run: npm run guard-tests
      - name: Instalar dependências
        run: npm ci
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes E2E (Playwright)
        run: npm run test:e2e
      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  metricas-do-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar resumo de métricas
        run: node scripts/metricas.mjs "origin/${{ github.base_ref }}" | tee metricas.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comentar métricas no Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file metricas.md --edit-last --create-if-none
